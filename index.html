<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Jurassic Sub</title>
    <meta name="description" content="A gentle underwater adventure through the Jurassic seas over Oxford." />
    <meta name="theme-color" content="#1f86b0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jurassic Sub" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud" hidden>
      <div id="frame"></div>
      <div id="reticle"></div>
      <div id="hint">👆</div>
      <div id="edge">🚧</div>
      <button id="mute" aria-label="Sound on or off">🔊</button>
      <button id="map" aria-label="Choose where to dive">🗺️</button>
      <div id="kid" aria-hidden="true">
        <svg viewBox="0 0 100 130">
          <circle cx="28" cy="38" r="6" />
          <circle cx="72" cy="38" r="6" />
          <circle cx="50" cy="34" r="22" />
          <path d="M44 14 Q50 4 58 12 Q54 16 44 14Z" />
          <path d="M8 130 C8 84 28 66 50 66 C72 66 92 84 92 130Z" />
        </svg>
        <span>1 m</span>
      </div>
      <div id="dash">
        <div class="dials"><i></i><i></i><i></i></div>
        <button id="screen" aria-label="Tell me more" disabled>
          <div id="sonar"></div>
          <img id="screen-img" alt="" />
          <span id="screen-name"></span>
          <span class="more">👆</span>
        </button>
        <div class="levers"><i></i><i></i></div>
      </div>
    </div>

    <div id="info" hidden>
      <div id="info-box">
        <button id="info-close" aria-label="Close">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1 9 9M9 1 1 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" /></svg>
        </button>
        <img id="info-img" alt="" />
        <div id="info-text">
          <h1 id="info-name"></h1>
          <ul id="info-facts"></ul>
          <p id="info-museum"></p>
        </div>
      </div>
    </div>

    <div id="start">
      <h1>Jurassic Sub</h1>
      <div id="regions"></div>
      <p>Oxford, 165 million years ago</p>
      <small id="version"></small>
    </div>

    <div id="loading" hidden>
      <div id="loading-emoji"></div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
